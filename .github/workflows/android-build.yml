name: Build Kivy APK

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - mainname: Build Kivy APK

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v2

      - name: Set up Python
        uses: actions/setup-python@v2
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            libssl-dev \
            libffi-dev \
            python3-dev \
            git \
            curl \
            unzip \
            openjdk-8-jdk

      - name: Install Android SDK
        run: |
          mkdir -p /home/runner/.buildozer/android/platform/android-sdk/cmdline-tools
          curl -o /home/runner/android-sdk.zip https://dl.google.com/android/repository/commandlinetools-linux-7302050_latest.zip
          unzip /home/runner/android-sdk.zip -d /home/runner/.buildozer/android/platform/android-sdk/cmdline-tools
          rm /home/runner/android-sdk.zip
          mv /home/runner/.buildozer/android/platform/android-sdk/cmdline-tools/cmdline-tools /home/runner/.buildozer/android/platform/android-sdk/cmdline-tools/latest

      - name: Accept licenses and install SDK components
        run: |
          /home/runner/.buildozer/android/platform/android-sdk/cmdline-tools/latest/bin/sdkmanager --licenses
          /home/runner/.buildozer/android/platform/android-sdk/cmdline-tools/latest/bin/sdkmanager "platform-tools" "build-tools;30.0.3" "platforms;android-30"

      - name: Install Buildozer
        run: |
          pip install --upgrade buildozer

      - name: Build APK
        run: |
          cd myapp  # Change 'myapp' to the correct folder where your Kivy app is located
          buildozer android debug


